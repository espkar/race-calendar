name: Update EQ Timing Suggestions

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-eqtiming-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and normalize EQ Timing events
        run: node scripts/update-eqtiming-events.js
      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- public/eqtiming-events.json; then
            echo "No changes to public/eqtiming-events.json - skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/eqtiming-events.json
            git commit -m "Update EQ Timing race suggestions snapshot"
            git push
          fi
